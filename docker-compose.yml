# Локальное развёртывание системы FoodFlow.
#   docker compose up -d --build     — собрать и запустить
#   http://localhost:8080            — веб-клиент и REST API (/api/v1, /api/docs)
#   http://localhost:8222            — мониторинг NATS
#
# Наружу опубликованы только API Gateway (и служебные порты для отладки):
# микросервисы доступны лишь во внутренней сети "backend".

x-service: &service
  build:
    context: .
    dockerfile: deployments/docker/Dockerfile
  restart: unless-stopped
  networks: [backend]
  environment: &common-env
    LOG_LEVEL: ${LOG_LEVEL:-info}
    NATS_URL: nats://nats:4222

services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./deployments/postgres/init.sql:/docker-entrypoint-initdb.d/01-init.sql:ro
    ports: ["5432:5432"]
    networks: [backend]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 3s
      retries: 20

  nats:
    image: nats:2.10-alpine
    restart: unless-stopped
    command: ["-js", "-sd", "/data", "-m", "8222", "--name", "foodflow-nats"]
    volumes:
      - natsdata:/data
    ports: ["4222:4222", "8222:8222"]
    networks: [backend]
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "-", "http://localhost:8222/healthz?js-enabled-only=true"]
      interval: 5s
      timeout: 3s
      retries: 20

  auth:
    <<: *service
    build: { context: ., dockerfile: deployments/docker/Dockerfile, args: { SERVICE: auth } }
    environment:
      <<: *common-env
      GRPC_ADDR: ":9001"
      DATABASE_URL: postgres://auth:auth@postgres:5432/auth?sslmode=disable
      JWT_SECRET: ${JWT_SECRET:-dev-secret-change-me}
      JWT_TTL: ${JWT_TTL:-24h}
      DEMO_SEED: ${DEMO_SEED:-true}
    depends_on:
      postgres: { condition: service_healthy }

  restaurant:
    <<: *service
    build: { context: ., dockerfile: deployments/docker/Dockerfile, args: { SERVICE: restaurant } }
    environment:
      <<: *common-env
      GRPC_ADDR: ":9002"
      DATABASE_URL: postgres://restaurant:restaurant@postgres:5432/restaurant?sslmode=disable
      DEMO_SEED: ${DEMO_SEED:-true}
    depends_on:
      postgres: { condition: service_healthy }

  order:
    <<: *service
    build: { context: ., dockerfile: deployments/docker/Dockerfile, args: { SERVICE: order } }
    environment:
      <<: *common-env
      GRPC_ADDR: ":9003"
      DATABASE_URL: postgres://orders:orders@postgres:5432/orders?sslmode=disable
      RESTAURANT_GRPC_ADDR: restaurant:9002
    depends_on:
      postgres: { condition: service_healthy }
      nats: { condition: service_healthy }
      restaurant: { condition: service_healthy }

  payment:
    <<: *service
    build: { context: ., dockerfile: deployments/docker/Dockerfile, args: { SERVICE: payment } }
    environment:
      <<: *common-env
      GRPC_ADDR: ":9004"
      DATABASE_URL: postgres://payment:payment@postgres:5432/payment?sslmode=disable
      PAYMENT_DELAY: ${PAYMENT_DELAY:-1500ms}
      PAYMENT_MAX_AMOUNT: ${PAYMENT_MAX_AMOUNT:-1000000}
    depends_on:
      postgres: { condition: service_healthy }
      nats: { condition: service_healthy }

  delivery:
    <<: *service
    build: { context: ., dockerfile: deployments/docker/Dockerfile, args: { SERVICE: delivery } }
    environment:
      <<: *common-env
      GRPC_ADDR: ":9005"
      DATABASE_URL: postgres://delivery:delivery@postgres:5432/delivery?sslmode=disable
    depends_on:
      postgres: { condition: service_healthy }
      nats: { condition: service_healthy }

  notification:
    <<: *service
    build: { context: ., dockerfile: deployments/docker/Dockerfile, args: { SERVICE: notification } }
    environment:
      <<: *common-env
      GRPC_ADDR: ":9006"
      DATABASE_URL: postgres://notification:notification@postgres:5432/notification?sslmode=disable
    depends_on:
      postgres: { condition: service_healthy }
      nats: { condition: service_healthy }

  gateway:
    <<: *service
    build: { context: ., dockerfile: deployments/docker/Dockerfile, args: { SERVICE: gateway } }
    environment:
      <<: *common-env
      HTTP_ADDR: ":8080"
      JWT_SECRET: ${JWT_SECRET:-dev-secret-change-me}
      AUTH_GRPC_ADDR: auth:9001
      RESTAURANT_GRPC_ADDR: restaurant:9002
      ORDER_GRPC_ADDR: order:9003
      PAYMENT_GRPC_ADDR: payment:9004
      DELIVERY_GRPC_ADDR: delivery:9005
      NOTIFICATION_GRPC_ADDR: notification:9006
      RATE_LIMIT_RPS: ${RATE_LIMIT_RPS:-20}
      RATE_LIMIT_BURST: ${RATE_LIMIT_BURST:-40}
    ports: ["${GATEWAY_PORT:-8080}:8080"]
    depends_on:
      auth: { condition: service_healthy }
      restaurant: { condition: service_healthy }
      order: { condition: service_healthy }
      payment: { condition: service_healthy }
      delivery: { condition: service_healthy }
      notification: { condition: service_healthy }

networks:
  backend:
    name: foodflow-backend

volumes:
  pgdata:
  natsdata:
