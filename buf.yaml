# Конфигурация buf: модуль с контрактами gRPC и правила линтинга.
version: v2
modules:
  - path: proto
lint:
  use:
    - STANDARD
  except:
    # Ответы некоторых RPC — доменные сущности (User, Order, …), а не *Response.
    - RPC_REQUEST_STANDARD_NAME
    - RPC_RESPONSE_STANDARD_NAME
    - RPC_REQUEST_RESPONSE_UNIQUE
breaking:
  use:
    - FILE
