# Непрерывная интеграция FoodFlow: проверка кода, тесты, сборка образов
# и сквозной тест всей системы, поднятой через Docker Compose.
name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: Статический анализ
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: gofmt
        run: test -z "$(gofmt -l $(git ls-files '*.go'))" || (gofmt -l . && exit 1)
      - name: go vet
        run: go vet ./...
      - name: Сгенерированный код protobuf актуален
        run: |
          go install google.golang.org/protobuf/cmd/protoc-gen-go@v1.36.12
          go install google.golang.org/grpc/cmd/protoc-gen-go-grpc@v1.6.2
          go install github.com/bufbuild/buf/cmd/buf@v1.74.0
          buf lint
          buf generate
          git diff --exit-code -- gen/

  test:
    name: Unit-тесты
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: go test (race + coverage)
        run: go test -race -coverprofile=coverage.out ./...
      - name: Покрытие
        run: go tool cover -func=coverage.out | tail -1
      - uses: actions/upload-artifact@v4
        with:
          name: coverage
          path: coverage.out

  build:
    name: Docker-образ ${{ matrix.service }}
    needs: [lint, test]
    runs-on: ubuntu-latest
    strategy:
      matrix:
        service: [gateway, auth, restaurant, order, payment, delivery, notification]
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: deployments/docker/Dockerfile
          build-args: SERVICE=${{ matrix.service }}
          tags: foodflow-${{ matrix.service }}:${{ github.sha }}
          push: false
          cache-from: type=gha,scope=${{ matrix.service }}
          cache-to: type=gha,mode=max,scope=${{ matrix.service }}

  e2e:
    name: Сквозной тест (Docker Compose)
    needs: [build]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: Запуск окружения
        run: docker compose up -d --build --wait --wait-timeout 300
      - name: E2E-тесты
        run: go test -tags e2e -count=1 -v ./test/e2e/...
      - name: Журналы сервисов при ошибке
        if: failure()
        run: docker compose logs --no-color
      - name: Остановка окружения
        if: always()
        run: docker compose down -v
